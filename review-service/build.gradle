plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.3.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'

	/* @Entity, @MappedSuperclass, @Embeddable 대상
	 1. open class로 컴파일
	 2. 파리미터 없는 생성자 추가 - noArg
	*/
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21'

	// KSP - Kotlin 네이티브 annotation processing (QueryDSL Q클래스 생성용, kapt 대체)
	id 'com.google.devtools.ksp' version '2.3.12'

	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

ext {
	set('springCloudVersion', '2025.1.1')
}

group = 'com.ecommerce'
version = '0.0.1-SNAPSHOT'
description = 'review-service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {

	// Eureka 클라이언트 (서비스 디스커버리 등록)
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	// OpenFeign (서비스 간 통신)
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// REST API
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Swagger (OpenAPI 3, springdoc)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	// JPA/Hibernate (ORM)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 입력값 검증 (@Valid, @NotBlank 등)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// MySQL 드라이버
	runtimeOnly 'com.mysql:mysql-connector-j'

	// QueryDSL (KSP 방식 - Kotlin 네이티브 Q클래스 생성)
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.1'
	ksp 'io.github.openfeign.querydsl:querydsl-ksp-codegen:7.1'

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
